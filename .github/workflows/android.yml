name: Build Android APK

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
    - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm install @capacitor/core
          npm install @capacitor/cli
          npm install @capacitor/android

      - name: Install Capacitor Assets
        run: npm install @capacitor/assets --save-dev

      - name: Install Splash Screen Plugin
        run: npm install @capacitor/splash-screen

      - name: Prepare Web Files
        run: |
          mkdir -p www
          cp index.html www/
          cp -r css www/
          cp -r js www/
          cp -r media www/

      - name: Create Capacitor Config
        run: |
          echo '{
            "appId": "azq.game.darbom",
            "appName": "DarBOM",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }' > capacitor.config.json

      - name: Initialize Capacitor
        run: npx cap init DarBOM azq.game.darbom --web-dir www

      - name: Add Android Platform
        run: npx cap add android

      - name: Create Resources Folder
        run: |
          mkdir -p resources
          cp media/pp.webp resources/icon.png
          cp media/pp.webp resources/splash.png

      - name: Generate Android Icons and Splash Screen
        run: npx capacitor-assets generate --assetPath resources

      - name: Sync Android
        run: npx cap sync android

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/darbom.jks

      # ── Build BIASA (push ke main, bukan tag) ──────────────────────────
      # Tetap pakai keystore asli (bukan debug key) supaya APK ini konsisten
      # bisa langsung update-install di atas APK Release manapun tanpa
      # bentrok signature. Bedanya cuma TIDAK dipublish sebagai GitHub Release,
      # cuma jadi artifact biasa buat kamu cek build-nya lancar.
      - name: Build APK (non-tag push)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/darbom.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload Build Artifact (non-tag push)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: DarBOM-build-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      # ── Build RELEASE (push tag v*.*.*) ────────────────────────────────
      - name: Build Release APK (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/darbom.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Rename APK (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          cp android/app/build/outputs/apk/release/app-release.apk DarBOM-v${VERSION}.apk

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DarBOM ${{ github.ref_name }}
          body: |
            ## DarBOM - Game Kartu Cari Bom

            ### Download
            Klik file **DarBOM-v*.apk** di bawah untuk mengunduh.

            ### Cara Install
            1. Download file DarBOM-v*.apk
            2. Buka file APK di HP
            3. Izinkan install dari sumber tidak dikenal jika diminta
            4. Install selesai!
          files: DarBOM-v*.apk
          draft: true
          prerelease: false

